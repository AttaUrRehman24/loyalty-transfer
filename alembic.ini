# Alembic configuration. Schema changes happen only through migrations in migrations/versions.
# The database URL is NOT stored here: migrations/env.py reads it from DATABASE_URL.

[alembic]
# Folder holding env.py and the versions/ directory.
script_location = migrations
# Let migrations import the app package (not needed today, kept for future data migrations).
prepend_sys_path = .
# Split prepend_sys_path with the OS path separator (silences a legacy-mode warning).
path_separator = os

# Alembic's own log output; JSON logging is only for the running service.
[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
